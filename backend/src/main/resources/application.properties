# THREE-MACHINE SETUP: DB laptop (MySQL) <- Backend laptop (this app) <- Frontend laptop (static files)
# Replace DB_LAPTOP_IP with the DB laptop's IP, or use localhost if everything runs on one machine.
server.port=8080

spring.datasource.url=jdbc:mysql://10.164.196.136:3306/ExamAllocateDB?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=examallocate
spring.datasource.password=examallocate123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tables come from ExamAllocate_NPTEL_Redesigned_MySQL.sql, so Hibernate must NOT touch the schema.
